name: CI - Solana Programs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'chains/solana/**'
      - '.github/workflows/ci-solana.yml'

jobs:
  solana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'chains/solana -> target'

      - name: Check Formatting
        run: |
          cd chains/solana
          cargo fmt --all -- --check

      - name: Clippy Linter
        run: |
          cd chains/solana
          cargo clippy -- -D warnings

      - name: Cargo Unit Tests
        run: |
          cd chains/solana
          cargo test

