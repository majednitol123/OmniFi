version: '3.8'

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: omnifi-anvil
    ports:
      - '8545:8545'
    command: anvil --host 0.0.0.0 --port 8545 --block-time 2 --chain-id 31337
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8545 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: omnifi-postgres
    environment:
      POSTGRES_USER: omnifi
      POSTGRES_PASSWORD: omnifi_dev_password
      POSTGRES_DB: omnifi_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omnifi -d omnifi_dev']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omnifi-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
